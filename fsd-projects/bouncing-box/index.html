<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 70px;
      height: 70px;
      background-color: teal;
      font-size: 300%;
      text-align: center;
      user-select: none;
      display: block;
      position: absolute;
      top: 100px;
      left: 0px;
      border-radius: 18px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
      transition: background-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .board {
      height: 100vh;
      background-image: linear-gradient(rgba(10, 30, 48, 0.55), rgba(10, 30, 48, 0.55)), url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen
      var boardHeight = jQuery(window).height();

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
        boardHeight = jQuery(window).height();
      });

      // moves the Box to a new position on the screen along the X-Axis
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      var positionX = 0;
      var positionY = 100;
      var points = 0;
      var speed = 10;
      var speedY = 6;
      var misses = 0;
      var maxMisses = 10;
      var interval = setInterval(update, 50);

      function getRandomColor() {
        var red = Math.floor(Math.random() * 256);
        var green = Math.floor(Math.random() * 256);
        var blue = Math.floor(Math.random() * 256);
        return "rgb(" + red + ", " + green + ", " + blue + ")";
      }

      function endGame() {
        clearInterval(interval);
        box.off("click", handleBoxClick);
        board.off("click", handleBoardClick);
        changeBoxText("X");
      }

      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {
        moveBoxTo(positionX, positionY);
        positionX += speed;
        positionY += speedY;

        if (positionX + box.width() >= boardWidth || positionX <= 0) {
          speed *= -1;
          positionX = Math.max(0, Math.min(positionX, boardWidth - box.width()));
        }

        if (positionY + box.height() >= boardHeight || positionY <= 0) {
          speedY *= -1;
          positionY = Math.max(0, Math.min(positionY, boardHeight - box.height()));
        }
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to the left side of the screen.
       */
      function handleBoxClick(event) {
        event.stopPropagation();
        points++;

        if (points % 3 === 0) {
          speed += 3;
          speedY += 2;
        }

        positionX = Math.random() * (boardWidth - box.width());
        positionY = Math.random() * (boardHeight - box.height());
        box.css("background-color", getRandomColor());
        changeBoxText(points);
        moveBoxTo(positionX, positionY);
      }

      function handleBoardClick(event) {
        if (event.target !== box[0]) {
          misses++;
          changeBoxText(misses + "/" + maxMisses);

          if (misses >= maxMisses) {
            endGame();
          }
        }
      }

      jQuery(window).on("resize", function () {
        boardWidth = board.width();
        boardHeight = jQuery(window).height();
        positionX = Math.min(positionX, boardWidth - box.width());
        positionY = Math.min(positionY, boardHeight - box.height());
      });

      board.on("click", handleBoardClick);
      box.on("click", handleBoxClick);

    })();
  </script>
</body>

</html>
